<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link href='https://unpkg.com/boxicons@2.0.9/css/boxicons.min.css' rel='stylesheet'>
	<link rel="stylesheet" href="../navbar/style.css">
	<title>Categories - BudgetTracker</title>
</head>
<body>
	<!-- SIDEBAR -->
	<section id="sidebar">
		<a href="#" class="brand">
			<i class='bx bxs-wallet'></i>
			<span class="text">BudgetTracker</span>
		</a>
		<ul class="side-menu top">
			<li>
				<a href="index.html">
					<i class='bx bxs-dashboard'></i>
					<span class="text">Dashboard</span>
				</a>
			</li>
			<li>
				<a href="add-transaction.html">
					<i class='bx bxs-plus-circle'></i>
					<span class="text">Add Transaction</span>
				</a>
			</li>
			<li class="active">
				<a href="categories.html">
					<i class='bx bxs-category'></i>
					<span class="text">Categories</span>
				</a>
			</li>
			<li>
				<a href="reports.html">
					<i class='bx bxs-report'></i>
					<span class="text">Reports</span>
				</a>
			</li>
			<li>
				<a href="accounts.html">
					<i class='bx bxs-bank'></i>
					<span class="text">Accounts</span>
				</a>
			</li>
		</ul>
		<ul class="side-menu">
			<li>
				<a href="#">
					<i class='bx bxs-cog'></i>
					<span class="text">Settings</span>
				</a>
			</li>
		</ul>
	</section>
	<!-- SIDEBAR -->

	<!-- CONTENT -->
	<section id="content">
		<!-- NAVBAR -->
		<nav>
			<i class='bx bx-menu'></i>
			<form action="#">
				<div class="form-input">
					<input type="search" placeholder="Search categories...">
					<button type="submit" class="search-btn"><img src="../imagini/search_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.png" alt="Search"></button>
				</div>
			</form>
			<input type="checkbox" id="switch-mode" hidden>
			<label for="switch-mode" class="switch-mode"></label>
			<a href="#" class="notification">
				<i class='bx bxs-bell'></i>
				<span class="num">3</span>
			</a>
			<div class="profile">
				<div class="info">
					<p>Hey, <b>User</b></p>
					<small class="text-muted">Admin</small>
				</div>
				<div class="profile-photo">
					<img src="../imagini/person_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.png" alt="Profile">
				</div>
			</div>
			<a href="#" id="logoutButton" class="logout-nav">
				<i class='bx bxs-log-out'></i>
				<span>Logout</span>
			</a>
		</nav>
		<!-- NAVBAR -->

		<!-- MAIN -->
		<main>
			<div class="head-title">
				<div class="left">
					<h1>Manage Categories</h1>
					<ul class="breadcrumb">
						<li>
							<a href="index.html">Dashboard</a>
						</li>
						<li><i class='bx bx-chevron-right'></i></li>
						<li>
							<a class="active" href="#">Categories</a>
						</li>
					</ul>
				</div>
			</div>

			<div class="table-data">
				<div class="order">
					<div class="head">
						<h3>Add New Category</h3>
					</div>
					<form id="addCategoryForm" class="transaction-form">
						<div class="form-group">
							<label for="categoryName">Category Name</label>
							<input type="text" id="categoryName" name="categoryName" required>
						</div>
						<div class="form-group">
							<label for="categoryType">Category Type</label>
							<select id="categoryType" name="categoryType" required>
								<option value="expense">Expense</option>
								<option value="income">Income</option>
							</select>
						</div>
						<button type="submit" class="btn-submit">Add Category</button>
					</form>
				</div>
				<div class="todo">
					<div class="head">
						<h3>Existing Categories</h3>
					</div>
					<h4>Income</h4>
					<ul class="todo-list" id="incomeCategoryList">
						<li><span>Loading...</span></li>
					</ul>
					<br>
					<h4>Expense</h4>
					<ul class="todo-list" id="expenseCategoryList">
						<li><span>Loading...</span></li>
					</ul>
				</div>
			</div>
		</main>
		<!-- MAIN -->
	</section>
	<!-- CONTENT -->

	<script src="../autentificare/auth.js"></script>
	<script src="../navbar/script.js"></script>
	<script src="categories.js"></script>
	<script>
		fetch('../footer/footer.html')
			.then(response => response.text())
			.then(data => {
				document.body.insertAdjacentHTML('beforeend', data);
			});
	</script>
</body>
</html>
