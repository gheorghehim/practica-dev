<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://unpkg.com/boxicons@2.0.9/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="../navbar/style.css">
    <title>Login - BudgetTracker</title>
    <style>
        :root {
            --primary: #1976D2;
            --light: #f6f6f9;
            --dark: #363949;
            --grey: #eee;
            --danger: #D32F2F;
            --light-danger: #FECDD3;
            --success: #388E3C;
            --light-success: #BBF7D0;
        }

        body {
            background: var(--grey);
            font-family: 'Poppins', sans-serif;
        }

        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--grey);
            padding: 20px;
        }

        .auth-box {
            background: var(--light);
            padding: 2.5rem;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            transition: transform 0.3s ease;
        }

        .auth-box:hover {
            transform: translateY(-5px);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .auth-header i {
            font-size: 3.5rem;
            color: var(--primary);
            margin-bottom: 1rem;
        }

        .auth-header h1 {
            margin: 1rem 0;
            color: var(--dark);
            font-size: 2rem;
        }

        .auth-form .form-group {
            margin-bottom: 1.5rem;
            position: relative;
        }

        .auth-form label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--dark);
            font-weight: 500;
        }

        .auth-form input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 2px solid var(--grey);
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .auth-form input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(25, 118, 210, 0.1);
        }

        .auth-form .input-icon {
            position: absolute;
            right: 1rem;
            top: 2.5rem;
            color: var(--dark);
            cursor: pointer;
        }

        .auth-btn {
            width: 100%;
            padding: 1rem;
            background: var(--primary);
            color: var(--light);
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }

        .auth-btn:hover {
            background: var(--dark);
            transform: translateY(-2px);
        }

        .auth-btn:active {
            transform: translateY(0);
        }

        .auth-link {
            text-align: center;
            margin-top: 1.5rem;
            color: var(--dark);
        }

        .auth-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .auth-link a:hover {
            color: var(--dark);
            text-decoration: underline;
        }

        .error-message {
            background: var(--light-danger);
            color: var(--danger);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .success-message {
            background: var(--light-success);
            color: var(--success);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 1rem;
        }

        .loading i {
            font-size: 1.5rem;
            color: var(--primary);
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <i class='bx bxs-wallet'></i>
                <h1>BudgetTracker</h1>
            </div>
            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>
            <form class="auth-form" id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required 
                           placeholder="Enter your username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required 
                           placeholder="Enter your password">
                    <i class='bx bx-hide input-icon' id="togglePassword"></i>
                </div>
                <button type="submit" class="auth-btn" id="loginButton">
                    Login
                </button>
                <div class="loading" id="loading">
                    <i class='bx bx-loader-alt'></i>
                </div>
            </form>
            <div class="auth-link">
                <p>Don't have an account? <a href="register.html">Register here</a></p>
            </div>
        </div>
    </div>
    <script src="auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const loginForm = document.getElementById('loginForm');
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');
            const loading = document.getElementById('loading');
            const loginButton = document.getElementById('loginButton');
            const togglePassword = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');

            // Toggle password visibility
            togglePassword.addEventListener('click', function() {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                this.classList.toggle('bx-hide');
                this.classList.toggle('bx-show');
            });

            // Form submission
            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;

                // Hide any previous messages
                errorMessage.style.display = 'none';
                successMessage.style.display = 'none';

                // Show loading state
                loginButton.style.display = 'none';
                loading.style.display = 'block';

                // Attempt login
                const result = login(username, password);
                
                if (result.success) {
                    // Successful login
                    successMessage.textContent = 'Login successful! Redirecting...';
                    successMessage.style.display = 'block';
                    
                    // Redirect after a short delay
                    setTimeout(() => {
                        window.location.href = '../continut/index.html';
                    }, 1500);
                } else {
                    // Failed login
                    errorMessage.textContent = result.message || 'Invalid username or password';
                    errorMessage.style.display = 'block';
                    
                    // Reset loading state
                    loginButton.style.display = 'block';
                    loading.style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
