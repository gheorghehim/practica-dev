<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://unpkg.com/boxicons@2.0.9/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="../navbar/style.css">
    <title>Register - BudgetTracker</title>
    <style>
        :root {
            --primary: #1976D2;
            --light: #f6f6f9;
            --dark: #363949;
            --grey: #eee;
            --danger: #D32F2F;
            --light-danger: #FECDD3;
            --success: #388E3C;
            --light-success: #BBF7D0;
        }

        body {
            background: var(--grey);
            font-family: 'Poppins', sans-serif;
        }

        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--grey);
            padding: 20px;
        }

        .auth-box {
            background: var(--light);
            padding: 2.5rem;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            transition: transform 0.3s ease;
        }

        .auth-box:hover {
            transform: translateY(-5px);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .auth-header i {
            font-size: 3.5rem;
            color: var(--primary);
            margin-bottom: 1rem;
        }

        .auth-header h1 {
            margin: 1rem 0;
            color: var(--dark);
            font-size: 2rem;
        }

        .auth-form .form-group {
            margin-bottom: 1.5rem;
            position: relative;
        }

        .auth-form label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--dark);
            font-weight: 500;
        }

        .auth-form input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 2px solid var(--grey);
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .auth-form input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(25, 118, 210, 0.1);
        }

        .auth-form .input-icon {
            position: absolute;
            right: 1rem;
            top: 2.5rem;
            color: var(--dark);
            cursor: pointer;
        }

        .auth-btn {
            width: 100%;
            padding: 1rem;
            background: var(--primary);
            color: var(--light);
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }

        .auth-btn:hover {
            background: var(--dark);
            transform: translateY(-2px);
        }

        .auth-btn:active {
            transform: translateY(0);
        }

        .auth-link {
            text-align: center;
            margin-top: 1.5rem;
            color: var(--dark);
        }

        .auth-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .auth-link a:hover {
            color: var(--dark);
            text-decoration: underline;
        }

        .error-message {
            background: var(--light-danger);
            color: var(--danger);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .success-message {
            background: var(--light-success);
            color: var(--success);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 1rem;
        }

        .loading i {
            font-size: 1.5rem;
            color: var(--primary);
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .password-requirements {
            margin-top: 0.5rem;
            padding: 0.5rem;
            background: var(--light);
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .password-requirements p {
            margin-bottom: 0.5rem;
            color: var(--dark);
            font-weight: 500;
        }

        .password-requirements ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .password-requirements li {
            display: flex;
            align-items: center;
            margin-bottom: 0.25rem;
            color: var(--dark);
        }

        .password-requirements li i {
            margin-right: 0.5rem;
            font-size: 1.1rem;
        }

        .requirement.valid {
            color: var(--success);
        }

        .requirement.valid i {
            color: var(--success);
        }

        .requirement.invalid {
            color: var(--danger);
        }

        .requirement.invalid i {
            color: var(--danger);
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <i class='bx bxs-wallet'></i>
                <h1>BudgetTracker</h1>
            </div>
            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>
            <form class="auth-form" id="registerForm">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" required 
                           placeholder="Enter your full name">
                </div>
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required 
                           placeholder="Enter your username"
                           minlength="3"
                           pattern="[a-zA-Z0-9_]+">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required 
                           placeholder="Enter your password"
                           minlength="8">
                    <i class='bx bx-hide input-icon' id="togglePassword"></i>
                    <div class="password-requirements" id="passwordRequirements">
                        <p>Password must contain:</p>
                        <ul>
                            <li id="length" class="requirement">
                                <i class='bx bx-x'></i>
                                At least 8 characters
                            </li>
                            <li id="uppercase" class="requirement">
                                <i class='bx bx-x'></i>
                                At least one uppercase letter
                            </li>
                            <li id="lowercase" class="requirement">
                                <i class='bx bx-x'></i>
                                At least one lowercase letter
                            </li>
                            <li id="number" class="requirement">
                                <i class='bx bx-x'></i>
                                At least one number
                            </li>
                            <li id="special" class="requirement">
                                <i class='bx bx-x'></i>
                                At least one special character (!@#$%^&*)
                            </li>
                        </ul>
                    </div>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required 
                           placeholder="Confirm your password"
                           minlength="6">
                    <i class='bx bx-hide input-icon' id="toggleConfirmPassword"></i>
                </div>
                <button type="submit" class="auth-btn" id="registerButton">
                    Register
                </button>
                <div class="loading" id="loading">
                    <i class='bx bx-loader-alt'></i>
                </div>
            </form>
            <div class="auth-link">
                <p>Already have an account? <a href="login.html">Login here</a></p>
            </div>
        </div>
    </div>
    <script src="auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const registerForm = document.getElementById('registerForm');
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');
            const loading = document.getElementById('loading');
            const registerButton = document.getElementById('registerButton');
            const togglePassword = document.getElementById('togglePassword');
            const toggleConfirmPassword = document.getElementById('toggleConfirmPassword');
            const passwordInput = document.getElementById('password');
            const confirmPasswordInput = document.getElementById('confirmPassword');

            // Toggle password visibility
            function setupPasswordToggle(toggle, input) {
                toggle.addEventListener('click', function() {
                    const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
                    input.setAttribute('type', type);
                    this.classList.toggle('bx-hide');
                    this.classList.toggle('bx-show');
                });
            }

            setupPasswordToggle(togglePassword, passwordInput);
            setupPasswordToggle(toggleConfirmPassword, confirmPasswordInput);

            // Password validation
            const requirements = {
                length: /.{8,}/,
                uppercase: /[A-Z]/,
                lowercase: /[a-z]/,
                number: /[0-9]/,
                special: /[!@#$%^&*]/
            };

            function validatePassword(password) {
                Object.keys(requirements).forEach(key => {
                    const requirement = document.getElementById(key);
                    const icon = requirement.querySelector('i');
                    
                    if (requirements[key].test(password)) {
                        requirement.classList.add('valid');
                        requirement.classList.remove('invalid');
                        icon.classList.remove('bx-x');
                        icon.classList.add('bx-check');
                    } else {
                        requirement.classList.add('invalid');
                        requirement.classList.remove('valid');
                        icon.classList.remove('bx-check');
                        icon.classList.add('bx-x');
                    }
                });
            }

            passwordInput.addEventListener('input', function() {
                validatePassword(this.value);
            });

            // Form submission
            registerForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const name = document.getElementById('name').value;
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirmPassword').value;

                // Hide any previous messages
                errorMessage.style.display = 'none';
                successMessage.style.display = 'none';

                // Validate password requirements
                const passwordValid = Object.keys(requirements).every(key => 
                    requirements[key].test(password)
                );

                if (!passwordValid) {
                    errorMessage.textContent = 'Please ensure your password meets all requirements';
                    errorMessage.style.display = 'block';
                    return;
                }

                // Validate passwords match
                if (password !== confirmPassword) {
                    errorMessage.textContent = 'Passwords do not match';
                    errorMessage.style.display = 'block';
                    return;
                }

                // Show loading state
                registerButton.style.display = 'none';
                loading.style.display = 'block';

                // Attempt registration
                const result = register(name, username, password);
                
                if (result.success) {
                    // Successful registration
                    successMessage.textContent = 'Registration successful! Redirecting to login...';
                    successMessage.style.display = 'block';
                    
                    // Redirect after a short delay
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 1500);
                } else {
                    // Failed registration
                    errorMessage.textContent = result.message || 'Registration failed';
                    errorMessage.style.display = 'block';
                    
                    // Reset loading state
                    registerButton.style.display = 'block';
                    loading.style.display = 'none';
                }
            });

            // Input validation
            const usernameInput = document.getElementById('username');
            usernameInput.addEventListener('input', function() {
                if (this.value.length < 3) {
                    this.setCustomValidity('Username must be at least 3 characters long');
                } else if (!/^[a-zA-Z0-9_]+$/.test(this.value)) {
                    this.setCustomValidity('Username can only contain letters, numbers, and underscores');
                } else {
                    this.setCustomValidity('');
                }
            });
        });
    </script>
</body>
</html>
